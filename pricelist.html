<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Head Lovers Prices</title>
</head>


<style>
        body {
            margin: 0px;
            padding: 0px;
            padding-top: 150px; /* To prevent content from being hidden behind the fixed header */
            font-family: Arial, sans-serif;
            background-color: #ffffff; /* Clean white base background to show the breaks */
        }

        /* --- RESPONSIVE HEADER --- */
        header {
            position:fixed;
            top: 0;
            left:0;
            z-index: 1000;
            background-color: #000000; 
            width: 100%;
            min-height: 150px; 
            display: flex;
            flex-direction: row; 
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px; 
            border-bottom: 20px solid #ffffff;
        }

        .header-icon {
            height: 120px;
            width: auto;   
            object-fit: contain;
        }

        .center-branding {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1; 
        }

        .header-logo {
            height: auto;
            max-height: 100px; 
            width: 100%;
            max-width: 300px;
            object-fit: contain;
        }

        .center-branding p {
            color: #b3b3b3; 
            font-size: 14px; 
            text-transform: uppercase;
            letter-spacing: 3px; 
            margin-top: 10px;
            text-align: center;
            line-height: 1.6;
        }

        /* --- HEADER NAVIGATION LINKS --- */
        .center-branding p a {
            color: #b3b3b3;                 
            text-decoration: none;          
            font-size: 14px;
            font-weight: 300;
            transition: color 0.3s ease;    
        }

        .center-branding p a:hover {
            color: #ad8913;                 
        }
</style>

<body>

    <header>
        <img src="elegant.jpg" alt="Elegant Head Lover's Salon Icon" class="header-icon">
        
        <div class="center-branding">
            <img src="Title.jpg" alt="Elegant Head Lover's Salon Logo" class="header-logo">
            <p>
                <a href="index.html">Home</a> &nbsp;|&nbsp; 
                <a href="pricelist.html">Price List</a> &nbsp;|&nbsp; 
                <a href="socials.html">Socials</a> &nbsp;|&nbsp; 
                <a href="#">Location</a> &nbsp;|&nbsp; 
                <a href="#">Contact Us</a>
            </p>
        </div>
    </header>
    
</body>


</html>
